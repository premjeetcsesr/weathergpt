name: WeatherGPT CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./weathergpt-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: test
          DEBUG: "false"
          MONGODB_URL: "mongodb://localhost:27017"
          JWT_SECRET_KEY: "ci-testing-jwt-secret-key-super-secure-32-chars-long"
        run: |
          pytest -v tests/

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./weathergpt-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./weathergpt-frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify Production Build
        run: npm run build
        env:
          VITE_API_BASE_URL: "/api/v1"
          VITE_WS_BASE_URL: "/api/v1"

  docker-build:
    name: Docker Container Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build
